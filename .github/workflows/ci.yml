name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: go test ./...
      - run: ./build.sh ci
      - uses: actions/upload-artifact@v4
        with:
          name: homeydeck-ha-agent
          path: agent/dist/homeydeck-ha-agent.exe

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests pair the real agent with a real Home Assistant, so they build it too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
